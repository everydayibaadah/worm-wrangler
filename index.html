<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/introPage.css">
    <script src="javascript/introPage.js"></script>

    <title> Worm Wrangler </title>
</head>

<body>
    <h1> Worm Wrangler </h1>
    <div class="container">
        <div class="innerContainer1">
            <img src="images/intro.png" alt="gameimage" width="600" height="495">
        </div>
        <div class="innerContainer2">
            <div class="gloveCustomizationArea">
                <p> Choose your gloves: </p>
                <div class="gloves">
                    <div class="gloveImage"></div>
                    <div class="gloveImage"></div>
                    <div class="gloveImage"></div>
                </div>
            </div>
            <div class="goToGameButtonDiv">
                <button>Go to game</button>
            </div>
            <div class="soundDiv">
                <label>sound:</label>
                <input type="checkbox">
                <label>Adjust volume:</label>
                <input type="range" ,min="0" max="10" value="5">
            </div>
        </div>
    </div>
</body>

</head>
